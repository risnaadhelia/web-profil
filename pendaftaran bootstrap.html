
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Pendaftaran Akun</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">Form Pendaftaran Akun</h2>

        <div class="card p-4 shadow">

            <form action="" method="post">

                <!-- Username -->
                <div class="mb-3">
                    <label for="username" class="form-label">
                        Username
                    </label>

                    <input type="text"
                           name="username"
                           id="username"
                           class="form-control"
                           placeholder="Masukkan username">
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input type="password"
                           name="password"
                           id="password"
                           class="form-control"
                           placeholder="Masukkan password">
                </div>

                <!-- Tanggal Lahir -->
                <div class="mb-3">
                    <label for="tanggal" class="form-label">
                        Tanggal Lahir
                    </label>

                    <input type="date"
                           name="tanggal"
                           id="tanggal"
                           class="form-control">
                </div>

                <!-- Jenis Kelamin -->
                <div class="mb-3">

                    <label class="form-label">
                        Jenis Kelamin
                    </label>

                    <div class="form-check">
                        <input type="radio"
                               name="gender"
                               value="Laki-laki"
                               id="pria"
                               class="form-check-input">

                        <label for="pria" class="form-check-label">
                            Laki-laki
                        </label>
                    </div>

                    <div class="form-check">
                        <input type="radio"
                               name="gender"
                               value="Perempuan"
                               id="wanita"
                               class="form-check-input">
